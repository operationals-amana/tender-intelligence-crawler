# Backend stack: Postgres, the FastAPI API and the scheduled crawler.
#
#   docker compose up -d --build          bring up db + api + worker
#   docker compose run --rm api seed      load company data and the first user
#   docker compose run --rm api crawl     one-off crawl instead of the schedule
#   docker compose run --rm api score     re-run the heuristic scorer
#
# The frontend is deployed separately (Vercel); to run the whole product
# locally including the UI, use the compose file in the parent directory.

name: tender-intelligence

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pguser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pgpass123}
      POSTGRES_DB: ${POSTGRES_DB:-tender-intelligence}
    ports:
      # Published on 5433 to match the development DATABASE_URL default, and to
      # stay clear of a Postgres already running on the host's 5432.
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pguser} -d ${POSTGRES_DB:-tender-intelligence}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["api"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Inside the network the database is reachable by service name on 5432,
      # regardless of which port it is published on.
      DATABASE_URL: postgresql://${POSTGRES_USER:-pguser}:${POSTGRES_PASSWORD:-pgpass123}@db:5432/${POSTGRES_DB:-tender-intelligence}
      PORT: 8000
      # alembic owns the schema here, so the app must not create tables itself.
      AUTO_CREATE_TABLES: "false"
      RUN_MIGRATIONS: "true"
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me}
      ACCESS_TOKEN_TTL_HOURS: ${ACCESS_TOKEN_TTL_HOURS:-12}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-4-5}
      SEED_USER_EMAIL: ${SEED_USER_EMAIL:-operationals@amana.id}
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD:-}
      SEED_USER_NAME: ${SEED_USER_NAME:-AMANA Operations}
    ports:
      - "${API_PORT:-8000}:8000"

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["worker"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-pguser}:${POSTGRES_PASSWORD:-pgpass123}@db:5432/${POSTGRES_DB:-tender-intelligence}
      AUTO_CREATE_TABLES: "false"
      # The API service already applied them; a second migrate on boot would
      # only race it.
      RUN_MIGRATIONS: "false"
      CRAWL_INTERVAL_HOURS: ${CRAWL_INTERVAL_HOURS:-6}
      CRAWL_DAYS: ${CRAWL_DAYS:-7}
      CRAWL_ROWS: ${CRAWL_ROWS:-500}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

volumes:
  pgdata:
