# The crawler on its own, against a local Postgres.
#
#   docker compose up -d crawler-server          the 12-hourly schedule + the trigger endpoint
#   docker compose run --rm crawler              one full cycle: crawl, score, assess
#   docker compose run --rm crawler crawl        crawl only
#   docker compose run --rm crawler score --llm  re-score and re-assess
#   docker compose --profile worker up -d        loop on the interval, with no trigger endpoint
#
# `crawler` is a one-shot job, so it is started with `run`, not `up`. Note that
# the schema is owned by the tender-intelligence app: point this at a database
# that app has already migrated (`npm run db:migrate`) and seeded (`npm run
# seed`), or the scoring stage will have no company profile to match against.
#
# To run the whole product locally including the UI, use the compose file in the
# parent directory instead.

name: tender-intelligence-crawler

x-crawler-env: &crawler-env
  # Inside the network the database is reachable by service name on 5432,
  # regardless of which port it is published on.
  DATABASE_URL: postgresql://${POSTGRES_USER:-pguser}:${POSTGRES_PASSWORD:-pgpass123}@db:5432/${POSTGRES_DB:-tender-intelligence}
  CRAWL_DAYS: ${CRAWL_DAYS:-7}
  CRAWL_ROWS: ${CRAWL_ROWS:-500}
  CRAWL_INTERVAL_HOURS: ${CRAWL_INTERVAL_HOURS:-12}
  CRAWLER_TRIGGER_TOKEN: ${CRAWLER_TRIGGER_TOKEN:-dev-only-change-me}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-4-5}
  LLM_LIMIT: ${LLM_LIMIT:-300}
  LLM_CONCURRENCY: ${LLM_CONCURRENCY:-4}
  SKIP_LLM: ${SKIP_LLM:-false}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pguser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pgpass123}
      POSTGRES_DB: ${POSTGRES_DB:-tender-intelligence}
    ports:
      # Published on 5433 to match the development DATABASE_URL default, and to
      # stay clear of a Postgres already running on the host's 5432.
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pguser} -d ${POSTGRES_DB:-tender-intelligence}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # The always-on shape: the recurring cycle plus the endpoint the app's
  # dashboard button calls. Published on the host so a `next dev` running
  # outside compose can reach it at http://localhost:8080.
  crawler-server:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["serve"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment: *crawler-env
    ports:
      - "${CRAWLER_PORT:-8080}:8080"

  crawler:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["cron"]
    # A batch job: it runs once and exits, so it must not be restarted.
    restart: "no"
    # Behind a profile so a bare `up` starts the server without also firing a
    # one-shot cycle at the same database.
    profiles: ["cron"]
    depends_on:
      db:
        condition: service_healthy
    environment: *crawler-env

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["worker"]
    restart: unless-stopped
    # Behind a profile so a bare `up` does not run the loop *and* the one-shot
    # job against the same database. Start it with `--profile worker`.
    profiles: ["worker"]
    depends_on:
      db:
        condition: service_healthy
    environment: *crawler-env

volumes:
  pgdata:
